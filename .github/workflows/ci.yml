name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: framework/src
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r docs/release/build-tools.lock
      - name: Public checkout without private corpus
        run: |
          python -B tools/verificar_dossie.py --mode public
          python -B -m unittest discover -s tools/tests -q
      - name: Behavior and coverage
        run: |
          python -m coverage run --branch --source=framework/src/specflow -m unittest discover -v -s framework/tests -p 'test_*.py'
          python -m coverage json -o coverage.json
          python -m coverage report --fail-under=80
          python - <<'PY'
          import json
          value = json.load(open('coverage.json'))
          assert all(x['summary']['percent_covered'] >= 80 for x in value['files'].values())
          PY
      - name: Build wheel from source distribution
        working-directory: framework
        run: python -m build --no-isolation --outdir ../release-dist
      - name: Clean installation and consumer smoke
        env:
          PYTHONPATH: ''
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, venv, json, os
          venv.create('.smoke', with_pip=True)
          scripts = pathlib.Path('.smoke') / ('Scripts' if os.name == 'nt' else 'bin')
          python = scripts / ('python.exe' if os.name == 'nt' else 'python')
          exe = scripts / ('specflow.exe' if os.name == 'nt' else 'specflow')
          wheel, = pathlib.Path('release-dist').glob('*.whl')
          subprocess.run([str(python), '-m', 'pip', 'install', '--no-index', '--no-deps', str(wheel)], check=True)
          def run(*args, expected=0):
              r = subprocess.run([str(exe), *args], capture_output=True, text=True)
              assert r.returncode == expected, (r.stdout, r.stderr)
              return r.stdout
          assert run('--version').strip() == '0.2.1'
          run('--help')
          run('init', '.consumer', '--integration', 'copilot', '--integration', 'codex', '--json')
          run('--project', '.consumer', 'doctor', '--json')
          change = json.loads(run('--project', '.consumer', 'nova-change', 'Smoke release', '--json'))['changeId']
          assert json.loads(run('--project', '.consumer', 'contexto', '--change', change, '--json'))['observedState'] == 'RASCUNHO'
          run('--project', '.consumer', 'implementar', '--change', change, '--json', expected=1)
          assert not pathlib.Path('.consumer/apps').exists()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.os }}-${{ matrix.python }}
          path: |
            release-dist/*
            coverage.json
          if-no-files-found: error
